<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>湾趣地图 · 大湾区亲子活动指南 | WanQu Map</title>
  <meta name="description" content="覆盖粤港澳大湾区11城的亲子活动地图 / A family-activity map covering all 11 Greater Bay Area cities." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="css/style.css?v=20260718f" />
</head>
<body>
  <!-- 顶部品牌栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🧭</span>
      <div class="brand-text">
        <strong>湾趣地图</strong>
        <small id="brand-sub">大湾区亲子活动指南</small>
      </div>
    </div>
    <div class="searchbox">
      <input id="search-input" type="search" placeholder="搜索地点、城市、关键词…" autocomplete="off" />
      <div id="search-results" class="search-results hidden"></div>
    </div>
    <div class="topbar-actions">
      <button id="btn-locale" class="topbar-btn" title="中 / EN">EN</button>
      <button id="btn-list" class="topbar-btn" title="列表视图">☰ 列表</button>
      <button id="btn-about" class="topbar-btn" title="关于">ⓘ</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧筛选栏 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <h2 id="filter-title">筛选</h2>
        <button id="btn-reset" class="link-btn">清除全部</button>
      </div>

      <section class="filter-group">
        <h3 id="cat-header">分类</h3>
        <div id="category-chips" class="chip-grid"></div>
      </section>

      <section class="filter-group">
        <h3 id="city-header">城市</h3>
        <div id="city-chips" class="chip-row"></div>
      </section>

      <section class="filter-group">
        <h3 id="cond-header">条件</h3>
        <div class="chip-row">
          <button class="chip cond-chip" data-cond="free">🆓 免费</button>
          <button class="chip cond-chip" data-cond="indoor">🏠 室内(雨天)</button>
          <button class="chip cond-chip" data-cond="outdoor">🌤 户外</button>
          <button class="chip cond-chip" data-cond="toddler">👶 幼儿友好</button>
        </div>
      </section>

      <div class="result-count" id="result-count"></div>
      <footer class="sidebar-foot">
        <p id="foot-note">📍 坐标为近似位置，出行前请以导航为准。</p>
        <p id="foot-fix"></p>
      </footer>
    </aside>

    <!-- 地图区域 -->
    <main class="map-wrap">
      <div id="map"></div>
      <button id="btn-locate" class="float-btn" title="定位到我附近">🎯 附近</button>
      <button id="btn-filter-toggle" class="float-btn float-btn-left" title="筛选">⚲ 筛选</button>
      <div class="legend" id="legend"></div>
    </main>

    <!-- 列表视图面板 -->
    <aside id="list-panel" class="list-panel hidden">
      <div class="list-head">
        <h2 id="list-title">全部地点</h2>
        <button id="btn-list-close" class="close-btn">×</button>
      </div>
      <div id="list-body" class="list-body"></div>
    </aside>
  </div>

  <!-- 详情卡片 -->
  <div id="detail-card" class="detail-card hidden"></div>

  <!-- 关于弹窗 -->
  <div id="about-modal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" id="btn-about-close">×</button>
      <div id="about-body"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="js/config.js?v=20260718f"></script>
  <script src="js/analytics.js?v=20260718f"></script>
  <script src="js/i18n.js?v=20260718f"></script>
  <script src="js/data.en.js?v=20260718f"></script>
  <script src="js/labels.js?v=20260718f"></script>
  <script src="js/data.js?v=20260718f"></script>
  <script src="js/app.js?v=20260718f"></script>
</body>
</html>
